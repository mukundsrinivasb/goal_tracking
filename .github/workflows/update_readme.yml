name: Update README 

on:
  push:
    paths:
      - 'logs/*.md' # Only run when a new entry is pushed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Find latest log and update README
        run: python scripts/update_readme.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]@users.noreply.github.com"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "logs: Update README with latest log" || echo "No changes to commit"
          git pull --rebase origin main
          git push
