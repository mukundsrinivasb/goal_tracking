name: Update README with Latest Log

on:
  push:
    paths:
      - 'logs/*.md' # Only run when a new entry is pushed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest log and update README
        run: |
          # Find the newest file in the logs directory
          LATEST_LOG=$(ls logs/*.md | sort -r | head -1)
          
          # Overwrite README.md with the latest log's contents
          echo "# Latest G.S.P. Log" > README.md
          cat "$LATEST_LOG" >> README.md

      - name: Commit and Push changes
        run: |
          git config  user.name "github-actions[bot]@users.noreply.github.com"
          git config  user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "logs: Update README with latest log" || echo "No changes to commit"
          git pull --rebase origin main
          git push
