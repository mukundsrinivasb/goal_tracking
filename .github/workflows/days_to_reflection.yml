name: Days Remaining to write a reflection

on:
  workflow_run:
    workflows: ["Update README"]
    types:
      - completed
    paths:
      - 'logs/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-days:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Calculate Days and Update README
        run: python scripts/calculate_days.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]@users.noreply.github.com"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: Auto-update README with number of days to reflection" || echo "No changes to commit"
          git pull --rebase origin main
          git push
