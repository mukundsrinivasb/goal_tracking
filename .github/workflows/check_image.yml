name: Validate Log Image

on:
  push:
    paths:
      - 'logs/*.md'
      - 'images/*.*'
  workflow_dispatch:

jobs:
  audit-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify corresponding image exists
        run: python scripts/validate_image.py
